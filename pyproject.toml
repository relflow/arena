[project]
name = "relflow-arena"
version = "0.1.0"
description = "RelFlow on the RelArena benchmark: structures derived from the database, run as the harness runs a model"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "relflow @ git+https://github.com/relflow/relflow@58b5b92",
    "duckdb==1.5.0",
    "polars>=2,<3",
    "relbench==2.1.2",
    "datasets==5.0.1",
    "huggingface-hub==0.36.2",
    "optuna>=4,<5",
]

[project.optional-dependencies]
text = ["relflow[text]"]
tracking = ["mlflow-skinny==3.17.0"]

[dependency-groups]
dev = [
    "modal>=1.6.2",
    "pytest>=8.4.1",
    "ruff>=0.12.12",
]

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["benchmarks*"]
namespaces = true

[tool.setuptools.package-data]
"*" = ["*.sql", "*.yaml", "*.json", "*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
lint.select = ["E4", "E7", "E9", "F", "I"]
